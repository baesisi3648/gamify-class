<!doctype html>
<html lang="ko">

<link rel="preload" as="font" type="font/woff2" href="/fonts/PretendardVariable.woff2" crossorigin />

<style>
body {
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  background: var(--d-bg);
  color: var(--d-text);
}

::selection { background: var(--lime); color: var(--lime-ink); }

.site-head {
  padding: 14px var(--pad);
  border-bottom: 1px solid var(--d-line);
}
.site-head .wordmark { color: var(--d-text); }

main {
  flex: 1;
  position: relative;
  display: flex;
  align-items: center;
  overflow: hidden;
  padding-block: clamp(56px, 10vw, 112px);
}

.glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(40rem 22rem at 30% 40%, rgba(163, 230, 53, 0.09), transparent 70%);
}

.wrap {
  position: relative;
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding-inline: var(--pad);
}

.eyebrow.label {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--lime);
  margin-bottom: 26px;
}
.eyebrow.label::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

h1 {
  font-size: clamp(3.5rem, 13vw, 9rem);
  line-height: 0.92;
  font-weight: 800;
  letter-spacing: -0.05em;
}

.sub {
  margin-top: clamp(24px, 3.5vw, 36px);
  font-size: clamp(1.35rem, 3.2vw, 2rem);
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -0.03em;
}

.desc {
  margin-top: 18px;
  max-width: 44ch;
  font-size: clamp(1rem, 1.5vw, 1.0625rem);
  color: var(--d-muted);
}

.cta {
  margin-top: 40px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.site-foot {
  padding: 22px var(--pad);
  border-top: 1px solid var(--d-line);
  color: var(--d-dim);
}
</style>
</head>

<body>

<header class="site-head">
  <a class="wordmark" href="/" aria-label="GAMIFY CLASS 홈">GAMIFY CLASS</a>
</header>

<main>
  <div class="glow" aria-hidden="true"></div>

  <div class="wrap">

      찾으시던 게임은 앱 목록에 다 있습니다.
    </p>

    <div class="cta">
      <a class="btn btn-lime" href="/apps">앱 목록으로 <span class="arw" aria-hidden="true">→</span></a>
      <a class="btn btn-outline-d" href="/">처음 화면으로</a>
    </div>
  </div>
</main>

<footer class="site-foot">
  <span class="eyebrow">© 2026 GAMIFY CLASS</span>
</footer>

</body>
